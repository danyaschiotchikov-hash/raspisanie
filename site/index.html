<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание консерватории</title>
<meta name="description" content="Расписание занятий Петрозаводской государственной консерватории им. А.К. Глазунова по группам и преподавателям">
<meta name="theme-color" content="#8c2331">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      </div>
      <div style="min-width:0">
        <h1 data-t="appTitle">Расписание</h1>
        <p data-t="appSub">Петрозаводская консерватория им. А.К. Глазунова</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="btn-refresh" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span class="lbl" data-t="refresh">Обновить с сайта</span>
      </button>
      <button class="btn" id="btn-personal" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></svg>
        <span class="lbl" data-t="personalLessons">Личные занятия</span>
        <span class="badge" id="personal-count" hidden></span>
      </button>
      <div class="langs" role="group" aria-label="Язык / 语言">
        <button type="button" data-lang="ru" aria-pressed="true">RU</button>
        <button type="button" data-lang="zh" aria-pressed="false">中文</button>
      </div>
    </div>
  </header>

  <section class="controls" id="controls"></section>
  <div id="titlebar"></div>
  <div class="weekbar" id="weekbar"></div>
  <main id="schedule"><div class="loading">…</div></main>
  <footer class="foot" id="foot"></footer>
</div>

<dialog id="dlg-item"></dialog>
<dialog id="dlg-edit"></dialog>
<dialog id="dlg-list"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
